<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Keep the Connection</title>

<style>
  body {
    margin: 0;
    background: #0b0b0b;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    font-family: monospace;
    color: white;
  }

  canvas {
    border: 4px solid white;
    image-rendering: pixelated;
  }
</style>
</head>

<body>

<canvas id="game" width="360" height="200"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

let connection = 100;
let running = true;
let win = false;

canvas.addEventListener("click", boost);
canvas.addEventListener("touchstart", boost);

function boost(e) {
  e.preventDefault();
  if (!running) return;
  connection += 8;
  if (connection > 100) connection = 100;
}

function update() {
  if (!running) return;

  connection -= 0.4;

  if (connection <= 0) {
    running = false;
  }

  if (connection >= 100 && timeAlive > 600) {
    win = true;
    running = false;
  }
}

let timeAlive = 0;

function drawCharacters() {
  // Girl - Brazil
  ctx.fillStyle = "#f1c40f";
  ctx.fillRect(40, 120, 12, 12);
  ctx.fillStyle = "#ffffff";
  ctx.fillRect(40, 132, 12, 12);

  // Boy - Japan
  ctx.fillStyle = "#000000";
  ctx.fillRect(308, 120, 12, 12);
  ctx.fillStyle = "#e74c3c";
  ctx.fillRect(308, 132, 12, 12);
}

function drawConnection() {
  ctx.strokeStyle = `rgba(255,255,255,${connection / 100})`;
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(52, 126);
  ctx.lineTo(308, 126);
  ctx.stroke();
}

function drawUI() {
  ctx.fillStyle = "white";
  ctx.fillText("KEEP THE CONNECTION", 90, 20);
  ctx.fillText("Tap to stay connected", 100, 36);

  ctx.fillRect(80, 50, connection * 2, 6);
}

function drawEnd() {
  ctx.fillStyle = "white";
  if (win) {
    ctx.fillText("CONNECTION ESTABLISHED", 80, 100);
    ctx.fillText("Merry Christmas ❤️", 100, 120);
  } else {
    ctx.fillText("CONNECTION LOST", 110, 100);
    ctx.fillText("Tap to try again", 120, 120);
  }
}

canvas.addEventListener("click", () => {
  if (!running) reset();
});

function reset() {
  connection = 100;
  timeAlive = 0;
  running = true;
  win = false;
}

function loop() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  drawUI();
  drawCharacters();
  drawConnection();

  if (running) {
    update();
    timeAlive++;
  } else {
    drawEnd();
  }

  requestAnimationFrame(loop);
}

loop();
</script>

</body>
</html>
